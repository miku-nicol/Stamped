openapi: 3.0.0
info:
  title: Stamped Authentication & Project Management API
  version: 2.0.0
  description: |
    Complete authentication & Project Management API for Stamped App supporting:
    - Local email/password registration & login
    - Google OAuth for web browsers
    - Google Sign-In for mobile apps (Flutter/React Native)
    - Password reset flow with email verification
    - Project Management (CRUD)
    - Deliverables Management
    - Client Link Generation
    
    ## Authentication Flow
    1. Register or login to receive a JWT token
    2. Include token in all authenticated requests: `Authorization: Bearer <token>`
    
    ## Google Sign-Up for Mobile (Flutter)
    For mobile apps, implement Google Sign-In natively:
    
    1. Add dependency: google_sign_in: ^6.1.0
    2. Configure with your Web Client ID
    3. Get ID token and send to /auth/google-mobile
    4. Backend returns JWT token for authenticated requests

servers:
  - url: http://localhost:9000/api/v1
    description: Development Server
  - url: https://stamped-pkrb.onrender.com/api/v1
    description: Production Server

tags:
  - name: Authentication
    description: Local email/password registration and login
  - name: Google Auth
    description: Google OAuth for web and mobile apps
  - name: Password Reset
    description: Forgot password and reset password flow
  - name: Projects
    description: Project CRUD operations
  - name: Deliverables
    description: Manage project deliverables
  - name: Client Links
    description: Generate and manage client shareable links

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT token from login/registration. Format: Bearer <token>

  schemas:
    # ==================== AUTH SCHEMAS ====================
    RegisterRequest:
      type: object
      required:
        - firstName
        - lastName
        - email
        - password
        - confirmPassword
      properties:
        firstName:
          type: string
          minLength: 2
          maxLength: 15
          example: John
        lastName:
          type: string
          minLength: 2
          maxLength: 15
          example: Doe
        email:
          type: string
          format: email
          example: john@example.com
        password:
          type: string
          minLength: 8
          example: Password123
        confirmPassword:
          type: string
          minLength: 8
          example: Password123

    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          example: john@example.com
        password:
          type: string
          example: Password123

    GoogleMobileRequest:
      type: object
      required:
        - token
      properties:
        token:
          type: string
          description: Google ID token from mobile SDK (NOT the access token)
          example: ya29.a0AfH6SOMETHING...

    ForgotPasswordRequest:
      type: object
      required:
        - email
      properties:
        email:
          type: string
          format: email
          example: john@example.com

    ResetPasswordRequest:
      type: object
      required:
        - token
        - newPassword
        - confirmPassword
      properties:
        token:
          type: string
          description: Reset token from email link
          example: abc123def456ghi789
        newPassword:
          type: string
          minLength: 8
          example: NewPassword123
        confirmPassword:
          type: string
          minLength: 8
          example: NewPassword123

    # ==================== PROJECT SCHEMAS ====================
    CreateProjectRequest:
      type: object
      required:
        - projectName
        - clientName
        - clientEmail
        - dueDate
        - deliverables
      properties:
        projectName:
          type: string
          example: Website Redesign
        clientName:
          type: string
          example: John Doe
        clientEmail:
          type: string
          format: email
          example: john@example.com
        clientPhone:
          type: string
          example: 08012345678
        currency:
          type: string
          enum: [NGN, USD, EUR, GBP]
          default: NGN
          example: NGN
        dueDate:
          type: string
          format: date
          example: 2024-12-31
        deliverables:
          type: array
          minItems: 1
          items:
            type: object
            required:
              - item
              - amount
            properties:
              item:
                type: string
                example: Homepage Design
              amount:
                type: number
                example: 200000

    AddDeliverableRequest:
      type: object
      required:
        - item
        - amount
      properties:
        item:
          type: string
          example: Mobile App Development
        amount:
          type: number
          example: 250000
        isExtra:
          type: boolean
          default: false
          description: Mark as extra work beyond original scope

    EditProjectRequest:
      type: object
      properties:
        projectName:
          type: string
          example: Updated Project Name
        clientName:
          type: string
          example: Updated Client Name
        clientEmail:
          type: string
          format: email
          example: updated@example.com
        clientPhone:
          type: string
          example: 08123456789
        dueDate:
          type: string
          format: date
          example: 2025-01-15

    EditDeliverableRequest:
      type: object
      properties:
        item:
          type: string
          example: Updated Deliverable Name
        amount:
          type: number
          example: 300000

    ProjectResponse:
      type: object
      properties:
        _id:
          type: string
        projectName:
          type: string
        clientName:
          type: string
        clientEmail:
          type: string
        amount:
          type: number
        currency:
          type: string
        dueDate:
          type: string
          format: date-time
        status:
          type: string
          enum: [draft, pending_confirmation, active, completed]
        deliverables:
          type: array
          items:
            type: object
            properties:
              id:
                type: integer
              item:
                type: string
              amount:
                type: number
              status:
                type: string
              submittedAt:
                type: string
                format: date-time
              approvedAt:
                type: string
                format: date-time
              fileUrl:
                type: string
              version:
                type: integer
        deliverablesSummary:
          type: object
          properties:
            total:
              type: integer
            approved:
              type: integer
            pending:
              type: integer
        activities:
          type: array
          items:
            type: object
            properties:
              action:
                type: string
              description:
                type: string
              performedBy:
                type: string
              performedByName:
                type: string
              timestamp:
                type: string
                format: date-time
        clientConfirmed:
          type: boolean
        clientConfirmedAt:
          type: string
          format: date-time
        areTermsLocked:
          type: boolean
        paymentStatus:
          type: string
          enum: [unpaid, partial, paid]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    ProjectsListResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: object
          properties:
            projects:
              type: array
              items:
                $ref: '#/components/schemas/ProjectResponse'
            pagination:
              type: object
              properties:
                page:
                  type: integer
                limit:
                  type: integer
                total:
                  type: integer
                totalPages:
                  type: integer
                hasNextPage:
                  type: boolean
                hasPrevPage:
                  type: boolean

    ClientLinkResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: object
          properties:
            clientLink:
              type: string
              example: https://stamped.com/client/project/abc123...
            clientLinkToken:
              type: string
        message:
          type: string

    DeleteProjectResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: object
          properties:
            id:
              type: string
            projectName:
              type: string
            message:
              type: string
        message:
          type: string

    SuccessResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
        data:
          type: object
          properties:
            accessToken:
              type: string
              description: JWT token for authenticated requests

    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string

    ValidateTokenResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          properties:
            valid:
              type: boolean
              example: true
            email:
              type: string
              example: john@example.com

paths:
  # ==================== AUTHENTICATION ENDPOINTS ====================
  /auth/register:
    post:
      summary: Register a new user
      description: Creates new user account. Password must be 8+ chars and match confirmPassword. Email must be unique.
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        201:
          description: User registered successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        400:
          description: Missing fields or password mismatch
        409:
          description: Email already registered
        500:
          description: Internal server error

  /auth/login:
    post:
      summary: Login with email and password
      description: Returns JWT token for authenticated requests.
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        200:
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        400:
          description: Missing email or password
        401:
          description: Invalid credentials or Google account

  /auth/google:
    get:
      summary: Google OAuth for web browsers
      description: Redirect users here for web Google login.
      tags:
        - Google Auth
      responses:
        302:
          description: Redirects to Google login page

  /auth/auth/google/callback:
    get:
      summary: Google OAuth callback (internal)
      description: Internal endpoint - Google redirects here. Do not call directly.
      tags:
        - Google Auth
      responses:
        302:
          description: Redirects to frontend with token

  /auth/google-mobile:
    post:
      summary: Google Sign-In for mobile apps
      description: For Flutter/React Native apps. Send Google ID token to get JWT.
      tags:
        - Google Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GoogleMobileRequest'
      responses:
        200:
          description: Google authentication successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        400:
          description: Missing token
        500:
          description: Google authentication failed

  /auth/forgot-password:
    post:
      summary: Request password reset email
      description: Sends reset link to email. Returns success even if email not found (security).
      tags:
        - Password Reset
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForgotPasswordRequest'
      responses:
        200:
          description: Reset email sent
        400:
          description: Google account detected

  /auth/reset-password:
    post:
      summary: Reset password using token
      description: Resets password using token from email.
      tags:
        - Password Reset
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordRequest'
      responses:
        200:
          description: Password reset successful
        400:
          description: Validation error

  /auth/validate-reset-token/{token}:
    get:
      summary: Validate reset token
      description: Check if reset token is valid before showing reset form.
      tags:
        - Password Reset
      parameters:
        - in: path
          name: token
          required: true
          schema:
            type: string
      responses:
        200:
          description: Token is valid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidateTokenResponse'
        400:
          description: Invalid or expired token

  # ==================== PROJECT ENDPOINTS ====================
  /projects:
    get:
      summary: Get all projects for freelancer
      description: Returns paginated list of projects with status filtering.
      tags:
        - Projects
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: status
          schema:
            type: string
            enum: [all, draft, pending, active, completed]
          default: all
          description: Filter by project status
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
          default: 1
          description: Page number for pagination
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 100
          default: 10
          description: Number of items per page
        - in: query
          name: sortBy
          schema:
            type: string
            enum: [createdAt, dueDate, projectName, amount]
          default: createdAt
          description: Field to sort by
        - in: query
          name: sortOrder
          schema:
            type: string
            enum: [asc, desc]
          default: desc
          description: Sort order
      responses:
        200:
          description: Projects retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectsListResponse'
        401:
          description: Unauthorized
        500:
          description: Internal server error

    post:
      summary: Create a new project
      description: Creates a new project with deliverables. Minimum one deliverable required.
      tags:
        - Projects
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProjectRequest'
            example:
              projectName: Website Redesign
              clientName: John Doe
              clientEmail: john@example.com
              clientPhone: 08012345678
              dueDate: 2024-12-31
              deliverables:
                - item: Homepage Design
                  amount: 200000
                - item: Mobile Layout
                  amount: 150000
      responses:
        201:
          description: Project created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      project:
                        $ref: '#/components/schemas/ProjectResponse'
                  message:
                    type: string
        400:
          description: Validation error - missing fields or invalid data
        401:
          description: Unauthorized
        500:
          description: Internal server error

  /projects/{projectId}:
    get:
      summary: Get project by ID
      description: Returns complete project details including deliverables and activities.
      tags:
        - Projects
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: projectId
          required: true
          schema:
            type: string
          description: Project ID
      responses:
        200:
          description: Project retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      project:
                        $ref: '#/components/schemas/ProjectResponse'
                  message:
                    type: string
        401:
          description: Unauthorized
        403:
          description: You don't have permission to view this project
        404:
          description: Project not found
        500:
          description: Internal server error

    put:
      summary: Edit project basic information
      description: Updates project name, client info, or due date. Only allowed for draft and pending confirmation projects.
      tags:
        - Projects
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: projectId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EditProjectRequest'
            example:
              projectName: Updated Project Name
              dueDate: 2025-01-15
      responses:
        200:
          description: Project updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      project:
                        $ref: '#/components/schemas/ProjectResponse'
                  message:
                    type: string
        400:
          description: Cannot edit project in current status
        401:
          description: Unauthorized
        403:
          description: No permission to edit
        404:
          description: Project not found
        500:
          description: Internal server error

    delete:
      summary: Delete a project
      description: Permanently deletes a project. Only allowed for draft and pending confirmation projects.
      tags:
        - Projects
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: projectId
          required: true
          schema:
            type: string
      responses:
        200:
          description: Project deleted successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteProjectResponse'
        400:
          description: Cannot delete project in current status
        401:
          description: Unauthorized
        403:
          description: No permission to delete
        404:
          description: Project not found
        500:
          description: Internal server error

  # ==================== DELIVERABLE ENDPOINTS ====================
  /projects/{projectId}/deliverable:
    post:
      summary: Add a deliverable to project
      description: Adds a new deliverable to an existing project.
      tags:
        - Deliverables
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: projectId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddDeliverableRequest'
            example:
              item: SEO Optimization
              amount: 80000
              isExtra: false
      responses:
        200:
          description: Deliverable added successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      project:
                        $ref: '#/components/schemas/ProjectResponse'
                  message:
                    type: string
        400:
          description: Validation error
        401:
          description: Unauthorized
        404:
          description: Project not found
        403:
          description: Cannot add deliverable - terms locked
        500:
          description: Internal server error

  /projects/{projectId}/deliverable/{index}:
    put:
      summary: Edit a deliverable
      description: Updates deliverable item name or amount.
      tags:
        - Deliverables
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: projectId
          required: true
          schema:
            type: string
        - in: path
          name: index
          required: true
          schema:
            type: integer
          description: Deliverable index in array (0-based)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EditDeliverableRequest'
            example:
              item: Updated Deliverable Name
              amount: 300000
      responses:
        200:
          description: Deliverable updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      project:
                        $ref: '#/components/schemas/ProjectResponse'
                  message:
                    type: string
        400:
          description: Cannot edit deliverable in current status
        401:
          description: Unauthorized
        404:
          description: Project or deliverable not found
        500:
          description: Internal server error

  # ==================== CLIENT LINK ENDPOINTS ====================
  /projects/{projectId}/generate-link:
    post:
      summary: Generate client shareable link
      description: |
        Generates a unique shareable link for the client to view and confirm the project.
        Once generated, the project terms become locked and cannot be edited.
      tags:
        - Client Links
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: projectId
          required: true
          schema:
            type: string
      responses:
        200:
          description: Client link generated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientLinkResponse'
        400:
          description: Link already generated or cannot generate
        401:
          description: Unauthorized
        403:
          description: No permission
        404:
          description: Project not found
        500:
          description: Internal server error