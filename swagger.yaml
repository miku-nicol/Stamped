openapi: 3.0.0
info:
  title: Stamped Authentication & Project Management API
  version: 2.0.0
  description: |
    Complete authentication & Project Management API for Stamped App supporting:
    - Local email/password registration & login
    - Google OAuth for web browsers
    - Google Sign-In for mobile apps (Flutter/React Native)
    - Password reset flow with email verification
    - Project Management (CRUD)
    - Deliverables Management (Add, Edit, Delete, Submit, Approve, Request Revision)
    - Client Link Generation & Confirmation (OTP-based)
    
    ## Authentication Flow
    1. Register or login to receive a JWT token
    2. Include token in all authenticated requests: `Authorization: Bearer <token>`
    
    ## Client Confirmation Flow
    1. Freelancer generates client link
    2. Client opens link and requests OTP
    3. Client receives OTP via email
    4. Client enters OTP and confirms project
    5. Project becomes Active and terms are locked

servers:
  - url: http://localhost:9000/api/v1
    description: Development Server
  - url: https://stamped-pkrb.onrender.com/api/v1
    description: Production Server

tags:
  - name: Authentication
    description: Local email/password registration and login
  - name: Google Auth
    description: Google OAuth for web and mobile apps
  - name: Password Reset
    description: Forgot password and reset password flow
  - name: Projects
    description: Project CRUD operations
  - name: Deliverables
    description: Manage project deliverables (Add, Edit, Delete, Submit)
  - name: Client Links
    description: Generate client shareable links
  - name: Client Confirmation
    description: Client OTP verification and project confirmation
  - name: Client Actions
    description: Client actions on project (approve deliverables, request revisions)

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT token from login/registration. Format: Bearer <token>

  schemas:
    # ==================== AUTH SCHEMAS ====================
    RegisterRequest:
      type: object
      required:
        - firstName
        - lastName
        - email
        - password
        - confirmPassword
      properties:
        firstName:
          type: string
          minLength: 2
          maxLength: 15
          example: John
        lastName:
          type: string
          minLength: 2
          maxLength: 15
          example: Doe
        email:
          type: string
          format: email
          example: john@example.com
        password:
          type: string
          minLength: 8
          example: Password123
        confirmPassword:
          type: string
          minLength: 8
          example: Password123

    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          example: john@example.com
        password:
          type: string
          example: Password123

    GoogleMobileRequest:
      type: object
      required:
        - token
      properties:
        token:
          type: string
          description: Google ID token from mobile SDK (NOT the access token)
          example: ya29.a0AfH6SOMETHING...

    ForgotPasswordRequest:
      type: object
      required:
        - email
      properties:
        email:
          type: string
          format: email
          example: john@example.com

    ResetPasswordRequest:
      type: object
      required:
        - token
        - newPassword
        - confirmPassword
      properties:
        token:
          type: string
          description: Reset token from email link
          example: abc123def456ghi789
        newPassword:
          type: string
          minLength: 8
          example: NewPassword123
        confirmPassword:
          type: string
          minLength: 8
          example: NewPassword123

    # ==================== PROJECT SCHEMAS ====================
    CreateProjectRequest:
      type: object
      required:
        - projectName
        - clientName
        - clientEmail
        - dueDate
        - deliverables
      properties:
        projectName:
          type: string
          example: Website Redesign
        clientName:
          type: string
          example: John Doe
        clientEmail:
          type: string
          format: email
          example: john@example.com
        clientPhone:
          type: string
          example: 08012345678
        currency:
          type: string
          enum: [NGN, USD, EUR, GBP]
          default: NGN
          example: NGN
        dueDate:
          type: string
          format: date
          example: 2024-12-31
        deliverables:
          type: array
          minItems: 1
          items:
            type: object
            required:
              - item
              - amount
            properties:
              item:
                type: string
                example: Homepage Design
              amount:
                type: number
                example: 200000

    AddDeliverableRequest:
      type: object
      required:
        - item
        - amount
      properties:
        item:
          type: string
          example: Mobile App Development
        amount:
          type: number
          example: 250000
        isExtra:
          type: boolean
          default: false
          description: Mark as extra work beyond original scope

    EditProjectRequest:
      type: object
      properties:
        projectName:
          type: string
          example: Updated Project Name
        clientName:
          type: string
          example: Updated Client Name
        clientEmail:
          type: string
          format: email
          example: updated@example.com
        clientPhone:
          type: string
          example: 08123456789
        dueDate:
          type: string
          format: date
          example: 2025-01-15

    EditDeliverableRequest:
      type: object
      properties:
        item:
          type: string
          example: Updated Deliverable Name
        amount:
          type: number
          example: 300000

    SubmitDeliverableRequest:
      type: object
      required:
        - supportingLinks
      properties:
        supportingLinks:
          type: array
          items:
            type: string
          example: ["https://drive.google.com/file/d/abc123", "https://figma.com/file/xyz789"]
          description: At least one supporting link is required
        submissionNotes:
          type: string
          example: Here is the completed homepage design with responsive layout
          description: Optional notes about the submission

    ConfirmProjectRequest:
      type: object
      required:
        - otp
      properties:
        otp:
          type: string
          example: "123456"
          description: 6-digit OTP sent to client email

    ProjectResponse:
      type: object
      properties:
        _id:
          type: string
        projectName:
          type: string
        clientName:
          type: string
        clientEmail:
          type: string
        totalAmount:
          type: number
        currency:
          type: string
        dueDate:
          type: string
          format: date-time
        status:
          type: string
          enum: [pending, active, completed]
        deliverables:
          type: array
          items:
            type: object
            properties:
              deliverableId:
                type: string
              item:
                type: string
              amount:
                type: number
              status:
                type: string
                enum: [pending, approved, revision_requested]
              supportingLinks:
                type: array
                items:
                  type: string
              submissionNotes:
                type: string
              submittedAt:
                type: string
                format: date-time
              approvedAt:
                type: string
                format: date-time
              version:
                type: integer
        activities:
          type: array
          items:
            type: object
            properties:
              action:
                type: string
              description:
                type: string
              performedBy:
                type: string
              performedByName:
                type: string
              timestamp:
                type: string
                format: date-time
        clientConfirmed:
          type: boolean
        clientConfirmedAt:
          type: string
          format: date-time
        areTermsLocked:
          type: boolean
        paymentStatus:
          type: string
          enum: [unpaid, partial, paid]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    ProjectsListResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: object
          properties:
            projects:
              type: array
              items:
                $ref: '#/components/schemas/ProjectResponse'
            pagination:
              type: object
              properties:
                page:
                  type: integer
                limit:
                  type: integer
                total:
                  type: integer
                totalPages:
                  type: integer
                hasNextPage:
                  type: boolean
                hasPrevPage:
                  type: boolean

    ClientLinkResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: object
          properties:
            clientLink:
              type: string
              example: https://stamped.com/client/project/abc123...
            clientLinkToken:
              type: string
        message:
          type: string

    OTPResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: object
          properties:
            expiresIn:
              type: integer
              description: OTP expiry time in minutes
        message:
          type: string

    DeleteProjectResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: object
          properties:
            id:
              type: string
            projectName:
              type: string
            message:
              type: string
        message:
          type: string

    DeleteDeliverableResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: object
          properties:
            id:
              type: string
            projectName:
              type: string
            deliverables:
              type: array
              items:
                type: object
                properties:
                  deliverableId:
                    type: string
                  item:
                    type: string
                  amount:
                    type: number
                  status:
                    type: string
            totalAmount:
              type: number
        message:
          type: string

    SuccessResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
        data:
          type: object
          properties:
            accessToken:
              type: string
              description: JWT token for authenticated requests

    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string

    ValidateTokenResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          properties:
            valid:
              type: boolean
              example: true
            email:
              type: string
              example: john@example.com

paths:
  # ==================== AUTHENTICATION ENDPOINTS ====================
  /auth/register:
    post:
      summary: Register a new user
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        201:
          description: User registered successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        400:
          description: Missing fields or password mismatch
        409:
          description: Email already registered

  /auth/login:
    post:
      summary: Login with email and password
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        200:
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        401:
          description: Invalid credentials

  /auth/google-mobile:
    post:
      summary: Google Sign-In for mobile apps
      tags:
        - Google Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GoogleMobileRequest'
      responses:
        200:
          description: Google authentication successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'

  /auth/forgot-password:
    post:
      summary: Request password reset email
      tags:
        - Password Reset
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForgotPasswordRequest'
      responses:
        200:
          description: Reset email sent

  /auth/reset-password:
    post:
      summary: Reset password using token
      tags:
        - Password Reset
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordRequest'
      responses:
        200:
          description: Password reset successful

  # ==================== PROJECT ENDPOINTS ====================
  /projects:
    get:
      summary: Get all projects for freelancer
      tags:
        - Projects
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: status
          schema:
            type: string
            enum: [all, pending, active, completed]
          default: all
        - in: query
          name: page
          schema:
            type: integer
          default: 1
        - in: query
          name: limit
          schema:
            type: integer
          default: 10
      responses:
        200:
          description: Projects retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectsListResponse'

    post:
      summary: Create a new project
      tags:
        - Projects
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProjectRequest'
      responses:
        201:
          description: Project created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      project:
                        $ref: '#/components/schemas/ProjectResponse'
                  message:
                    type: string

  /projects/{projectId}:
    get:
      summary: Get project by ID
      tags:
        - Projects
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: projectId
          required: true
          schema:
            type: string
      responses:
        200:
          description: Project retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      project:
                        $ref: '#/components/schemas/ProjectResponse'

    put:
      summary: Edit project basic information
      tags:
        - Projects
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: projectId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EditProjectRequest'
      responses:
        200:
          description: Project updated successfully

    delete:
      summary: Delete a project
      tags:
        - Projects
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: projectId
          required: true
          schema:
            type: string
      responses:
        200:
          description: Project deleted successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteProjectResponse'

  # ==================== DELIVERABLE ENDPOINTS ====================
  /projects/{projectId}/deliverable:
    post:
      summary: Add a deliverable to project
      tags:
        - Deliverables
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: projectId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddDeliverableRequest'
      responses:
        200:
          description: Deliverable added successfully

  /projects/{projectId}/deliverable/{deliverableId}:
    put:
      summary: Edit a deliverable by ID
      tags:
        - Deliverables
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: projectId
          required: true
          schema:
            type: string
        - in: path
          name: deliverableId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EditDeliverableRequest'
      responses:
        200:
          description: Deliverable updated successfully

    delete:
      summary: Delete a deliverable by ID
      tags:
        - Deliverables
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: projectId
          required: true
          schema:
            type: string
        - in: path
          name: deliverableId
          required: true
          schema:
            type: string
      responses:
        200:
          description: Deliverable deleted successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteDeliverableResponse'
        400:
          description: Cannot delete deliverable in current project status
        401:
          description: Unauthorized
        404:
          description: Project or deliverable not found

  /projects/{projectId}/deliverable/{deliverableId}/submit:
    post:
      summary: Submit deliverable for client approval (Freelancer)
      tags:
        - Deliverables
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: projectId
          required: true
          schema:
            type: string
        - in: path
          name: deliverableId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmitDeliverableRequest'
      responses:
        200:
          description: Deliverable submitted successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      project:
                        $ref: '#/components/schemas/ProjectResponse'
                  message:
                    type: string
        400:
          description: Validation error - supporting links required or project not active
        401:
          description: Unauthorized
        404:
          description: Project or deliverable not found

  # ==================== CLIENT LINK ENDPOINTS ====================
  /projects/{projectId}/generate-link:
    post:
      summary: Generate client shareable link
      tags:
        - Client Links
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: projectId
          required: true
          schema:
            type: string
      responses:
        200:
          description: Client link generated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientLinkResponse'

  # ==================== CLIENT CONFIRMATION ENDPOINTS ====================
  /projects/client/{token}:
    get:
      summary: Client views project (public)
      tags:
        - Client Actions
      parameters:
        - in: path
          name: token
          required: true
          schema:
            type: string
      responses:
        200:
          description: Project retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      project:
                        type: object
                        properties:
                          _id:
                            type: string
                          projectName:
                            type: string
                          clientName:
                            type: string
                          freelancerName:
                            type: string
                          amount:
                            type: number
                          dueDate:
                            type: string
                          deliverables:
                            type: array
                          clientConfirmed:
                            type: boolean
                          areTermsLocked:
                            type: boolean
        404:
          description: Invalid or expired project link

  /projects/client/{token}/send-otp:
    post:
      summary: Send OTP to client email for confirmation
      tags:
        - Client Confirmation
      parameters:
        - in: path
          name: token
          required: true
          schema:
            type: string
      responses:
        200:
          description: OTP sent successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OTPResponse'
        400:
          description: Project already confirmed
        404:
          description: Invalid project link

  /projects/client/{token}/resend-otp:
    post:
      summary: Resend OTP to client email
      tags:
        - Client Confirmation
      parameters:
        - in: path
          name: token
          required: true
          schema:
            type: string
      responses:
        200:
          description: OTP resent successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OTPResponse'
        400:
          description: Project already confirmed
        404:
          description: Invalid project link

  /projects/client/{token}/confirm:
    post:
      summary: Confirm project with OTP
      tags:
        - Client Confirmation
      parameters:
        - in: path
          name: token
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfirmProjectRequest'
      responses:
        200:
          description: Project confirmed successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      _id:
                        type: string
                      projectName:
                        type: string
                      status:
                        type: string
                      areTermsLocked:
                        type: boolean
                      clientConfirmed:
                        type: boolean
                      clientConfirmedAt:
                        type: string
                  message:
                    type: string
        400:
          description: Invalid OTP, expired OTP, or project already confirmed
        404:
          description: Invalid project link

  # ==================== CLIENT ACTION ENDPOINTS ====================
  /projects/client/{token}/deliverable/{deliverableId}/approve:
    post:
      summary: Client approves a deliverable by ID
      tags:
        - Client Actions
      parameters:
        - in: path
          name: token
          required: true
          schema:
            type: string
        - in: path
          name: deliverableId
          required: true
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties: {}
      responses:
        200:
          description: Deliverable approved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      project:
                        $ref: '#/components/schemas/ProjectResponse'
                  message:
                    type: string
        400:
          description: Cannot approve deliverable
        404:
          description: Invalid project link or deliverable not found

  /projects/client/{token}/deliverable/{deliverableId}/request-revision:
    post:
      summary: Client requests revision on a deliverable
      tags:
        - Client Actions
      parameters:
        - in: path
          name: token
          required: true
          schema:
            type: string
        - in: path
          name: deliverableId
          required: true
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties: {}
      responses:
        200:
          description: Revision requested successfully. Freelancer has been notified.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      project:
                        $ref: '#/components/schemas/ProjectResponse'
                  message:
                    type: string
        400:
          description: Cannot request revision (project not active or deliverable already approved)
        404:
          description: Invalid project link or deliverable not found